[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-gui-runner"
version = "0.1.1"
description = "Interactive CLI Quick-Reference & Cheat Sheet GUI Runner with parameter extraction and live terminal streaming"
readme = "README.md"
authors = [
    { name = "David Field", email = "david.field@optos.com" }
]
license = { text = "MIT" }
keywords = ["cli", "gui", "cheat-sheet", "runner", "tkinter", "productivity", "sysadmin", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
cli-gui-runner = "cli_gui_runner:main"

[project.urls]
Homepage = "https://github.com/fied1k/cli-gui-runner"
Repository = "https://github.com/fied1k/cli-gui-runner.git"
Issues = "https://github.com/fied1k/cli-gui-runner/issues"
Changelog = "https://github.com/fied1k/cli-gui-runner/blob/main/CHANGELOG.md"
